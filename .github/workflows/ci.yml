name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test & screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, all 9 debug apps + one minified release
        run: ./gradlew :core:test assembleDebug assembleSwiftrideRiderRelease --stacktrace

      - name: Record Compose screenshots (Roborazzi)
        run: ./gradlew :ui:recordRoborazziDebug --stacktrace

      - name: Collect screenshots
        run: |
          mkdir -p docs/screenshots
          cp ui/build/outputs/roborazzi/*.png docs/screenshots/
          ls -la docs/screenshots

      - name: Upload APKs, reports and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: whitelabel-rides-build
          path: |
            app/build/outputs/apk/**/*.apk
            ui/build/reports/tests/
            docs/screenshots/*.png

      - name: Commit updated screenshots
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "Screenshots unchanged"
          else
            git commit -m "docs: update screenshots [skip ci]"
            git push
          fi
